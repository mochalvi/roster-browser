name: Roster Release (Windows)

# Builds the Windows installer on GitHub's runners (16 GB RAM) and publishes it
# as a GitHub Release, so people can download Roster without building it.
#
# Manual trigger only — run it from the Actions tab or with:
#   gh workflow run "Roster Release (Windows)" -f tag=v0.36.0
# A separate workflow on purpose, so it never collides with Donut's inherited
# tag-triggered release pipeline.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.36.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      # LLVM is pre-installed on windows-latest; winfsp-sys/bindgen needs libclang.
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build only — the default fork GITHUB_TOKEN is read-only and cannot create
      # a release, so the installer is uploaded as an artifact and the release is
      # published separately by a maintainer with write access.
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: roster-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
