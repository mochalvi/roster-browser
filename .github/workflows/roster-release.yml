name: Roster Release

# Builds Roster for Windows, macOS and Linux on GitHub's runners and uploads
# each platform's installers as an artifact, so nobody has to build locally.
#
# Manual trigger only — run it from the Actions tab or with:
#   gh workflow run "Roster Release" -f tag=v0.37.0
# A separate workflow on purpose, so it never collides with Donut's inherited
# tag-triggered release pipeline. The default fork GITHUB_TOKEN is read-only,
# so the release itself is published by a maintainer from these artifacts.
#
# Platforms follow what Wayfern (the browser engine) ships: Windows x64,
# macOS Apple Silicon and Linux x64.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag shown in the app (e.g. v0.37.0)"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*-setup.exe
          - platform: macos-latest
            name: macos-arm64
            bundles: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb,rpm
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

    runs-on: ${{ matrix.platform }}
    env:
      # Shown as the app version (build.rs); without it a manual run reads "main".
      BUILD_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point bindgen at libclang (Windows)
        # LLVM is pre-installed on windows-latest; winfsp-sys/bindgen needs it.
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config unzip xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: roster-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
